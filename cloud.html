<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MURON WEB</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/moji.css">
    <script src="js/script.js"></script>
</head>

<style>
    main { font-family: sans-serif; padding: 20px; }
    input, button { margin: 5px 0; }
    img { margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
</style>


<body>
    <header id="common-header">
        <div class="header-left">
            <button onclick="location.href='dashboard.html'">ダッシュボードに戻る</button>
        </div>
        <div class="header-right" id="clock"></div>
    </header>
    <!--以下オリジナル。文字寄せ使用する際はcss引用追加せよ-->
    <main>
        <h2>&nbsp;&nbsp;&nbsp;村音WEB&nbsp;&nbsp;簡易掲示板システム</h2>
        <p style="font-size: 15px;">&nbsp;&nbsp;このシステムは仮設です。<br>&nbsp;&nbsp;外部サービスを使用しているので個人名等記載のあるものはアップロードしないでください。</p>


        <!--ここから掲示板-->
        <input type="text" id="name" placeholder="名前"><br>
  <input type="text" id="message" placeholder="メッセージ"><br>
  <input type="file" id="fileInput"><br>
  <button onclick="postMessage()">投稿</button>

  <h2>投稿一覧</h2>
  <ul id="messages"></ul>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script>
    // ここに自分のSupabase情報を入れてください
    const supabase = supabase.createClient(
      'https://szawyuurngypoiispviu.supabase.co', // ←あなたのURL
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6YXd5dXVybmd5cG9paXNwdml1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDc0NTMyMTYsImV4cCI6MjA2MzAyOTIxNn0.62rwc1HO9FIsbr9YFLLoBiAOnV-b53rT8f3wPF9OTCk'                 // ←あなたのキー
    );

    // 投稿の表示関数
    function renderMessage(m) {
      const li = document.createElement("li");
      li.textContent = `${m.name}: ${m.message} (${new Date(m.created_at).toLocaleString()})`;

      if (m.file_url) {
        const img = document.createElement("img");
        img.src = m.file_url;
        img.style.maxWidth = "200px";
        li.appendChild(document.createElement("br"));
        li.appendChild(img);
      }

      return li;
    }

    // 投稿処理
    async function postMessage() {
      const name = document.getElementById("name").value;
      const msg = document.getElementById("message").value;
      const file = document.getElementById("fileInput").files[0];
      let fileUrl = null;

      if (!name || !msg) {
        alert("名前とメッセージを入力してください。");
        return;
      }

      // 添付ファイルがある場合アップロード
      if (file) {
        const filePath = `${Date.now()}_${file.name}`;
        const { error: uploadError } = await supabase.storage
          .from('attachments')
          .upload(filePath, file);

        if (uploadError) {
          alert("ファイルのアップロードに失敗しました: " + uploadError.message);
          return;
        }

        const { data: publicData } = supabase.storage
          .from('attachments')
          .getPublicUrl(filePath);

        fileUrl = publicData.publicUrl;
      }

      await supabase.from("messages").insert([{
        name: name,
        message: msg,
        file_url: fileUrl
      }]);

      // 投稿後にフォームクリア
      document.getElementById("message").value = "";
      document.getElementById("fileInput").value = "";
    }

    // 投稿を取得して表示
    async function fetchMessages() {
      const { data, error } = await supabase
        .from("messages")
        .select("*")
        .order("created_at", { ascending: false });

      const ul = document.getElementById("messages");
      ul.innerHTML = "";
      data.forEach(m => {
        ul.appendChild(renderMessage(m));
      });
    }

    // リアルタイム更新
    supabase
      .channel('public:messages')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' },
        (payload) => {
          const m = payload.new;
          document.getElementById("messages").prepend(renderMessage(m));
        }
      )
      .subscribe();

    // 初期表示
    fetchMessages();
  </script>

        </main>
    <script>
        window.onload = function() {
            loadCommonHeader();
            updateClock();
            setInterval(updateClock, 1000);
        };
    </script>

    <!--ipad用のアニメーションん-->
<script>
  document.querySelectorAll('.macro-button').forEach(button => {
  button.addEventListener('touchstart', () => {
    button.classList.add('active-touch');
  });
  button.addEventListener('touchend', () => {
    button.classList.remove('active-touch');
  });
});
</script>

</body>
</html>
