<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MURON WEB</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/moji.css">
    <link rel="stylesheet" href="../../css/samplecode.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Hachi+Maru+Pop&family=Pattaya&display=swap" rel="stylesheet">
    <script src="../../js/script.js"></script>
</head>
<body>
    <header id="common-header">
        <div class="header-left">
            <button class="macro-button" onclick="location.href='../manyuaru.html'"><b>←</b></button>
        </div>
        <div class="header-right" id="clock"></div>
    </header>
    <!--以下オリジナル。文字寄せ使用する際はcss引用追加せよ-->
    <main>
        <div class="dotgothic16-regular moji-senta">
            <p style="color:rgb(0, 17, 250); font-size: 25px;">◇&nbsp;特殊要素情報&nbsp;◇</p>
        </div>

        <div class="container">

            <!--カードを随時追加可能-->
    
            <div class="card">
                <div class="question">
                    <strong>Q: &lt;br&gt;は何をするタグですか？</strong>
                </div>
                <div class="answer">
                    <p><strong>A:</strong> &lt;br&gt;タグは改行を行います。文章やテキストを次の行に移動させる時に使います。</p>
                    <pre><code>&lt;p&gt;これが最初の行。&lt;br&gt;これが改行後の行。&lt;/p&gt;</code></pre>
                </div>
            </div>
    
            <div class="card">
                <div class="question">
                    <strong>Q: &amp;nbsp;は何をするものですか？</strong>
                </div>
                <div class="answer">
                    <p><strong>A:</strong> &amp;nbsp;は「ノーブレークスペース」を意味し、通常の空白文字と違い、改行されません。文中でスペースを挿入したい時に使います。</p>
                    <pre><code>&lt;p&gt;これは&amp;nbsp;スペース&amp;nbsp;の例です。&lt;/p&gt;</code></pre>
                </div>
            </div>
    
        </div>

        </main>
    <script>
        window.onload = function() {
            loadCommonHeader();
            updateClock();
            setInterval(updateClock, 1000);
        };
    </script>
</body>
</html>
